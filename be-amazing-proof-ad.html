<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be Amazing — Proof Ad 1080×1080</title>
  <!--
    ZERO external dependencies — opens directly via file:// (double-click).
    System font stack: Gill Sans (Mac) → Century Gothic (Win) → Arial fallback.
    1080 × 1080 px canvas. Screenshot at 100% zoom for pixel-exact export.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #B0AEA9;
      padding: 40px;
      /* System geometric sans — no network needed */
      font-family:
        'Gill Sans MT', 'Gill Sans', 'Century Gothic',
        'Trebuchet MS', Arial, sans-serif;
    }

    /* ─── 1080 × 1080 canvas ─── */
    .ad {
      position: relative;
      width: 1080px;
      height: 1080px;
      background: #F8F5EF;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Dot-grid background texture */
    .bg-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#C4C1BA 2px, transparent 2px);
      background-size: 35px 35px;
      opacity: 0.3;
    }

    /* Radial fade — hides dots behind the product */
    .bg-fade {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 58% 54% at 50% 51%,
        #F8F5EF 18%, rgba(248,245,239,0) 100%
      );
    }

    /* ─── Headline ─── */
    .headline {
      position: absolute;
      top: 52px;
      left: 0; right: 0;
      text-align: center;
      padding: 0 110px;
      z-index: 10;
      line-height: 1.15;
    }
    .hl1 {
      display: block;
      font-size: 40px;
      font-weight: 800;
      color: #1C1C1C;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .hl2 {
      display: block;
      font-size: 40px;
      font-weight: 900;
      color: #28C76F;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ─── Metric callouts ─── */
    .metric {
      position: absolute;
      z-index: 10;
      width: 205px;
      text-align: center;
    }
    .mn {
      font-size: 80px;
      font-weight: 900;
      color: #28C76F;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .ml {
      font-size: 15px;
      font-weight: 700;
      color: #6E6B64;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-top: 8px;
      line-height: 1.5;
    }

    .m-tl { top: 218px;    left:  62px; }
    .m-tr { top: 218px;    right: 62px; }
    .m-bl { bottom: 218px; left:  62px; }
    .m-br { bottom: 218px; right: 62px; }

    /* ─── Footer ─── */
    .tagline {
      position: absolute;
      bottom: 42px; left: 58px;
      font-size: 14px;
      font-weight: 700;
      color: #B0ACA5;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      z-index: 10;
    }
    .logo {
      position: absolute;
      bottom: 38px; right: 58px;
      display: flex; align-items: center; gap: 10px;
      z-index: 10;
    }
    .logo-mark {
      width: 38px; height: 38px;
      background: #28C76F;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900;
      color: white; letter-spacing: 0.02em;
    }
    .logo-name {
      font-size: 18px; font-weight: 800;
      color: #1C1C1C;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ─── Divider lines between metric and centre ─── */
    .divider {
      position: absolute;
      z-index: 4;
      background: #E0DCD4;
    }
    .divider-h {
      height: 1px;
      width: 260px;
      top: 50%;
      transform: translateY(-50%);
    }
    .divider-h.left  { left: 0; }
    .divider-h.right { right: 0; }
    .divider-v {
      width: 1px;
      height: 260px;
      left: 50%;
      transform: translateX(-50%);
    }
    .divider-v.top    { top: 0; }
    .divider-v.bottom { bottom: 0; }
  </style>
</head>
<body>
<div class="ad">

  <div class="bg-dots"></div>
  <div class="bg-fade"></div>

  <!-- ── Headline ── -->
  <div class="headline">
    <span class="hl1">Clean Ingredients.</span>
    <span class="hl2">Undeniable Results.</span>
  </div>

  <!-- ══════════════════════════════════════════════════
       SVG LAYER — arrows + supplement tub
       All coordinates native 1080px.
       ══════════════════════════════════════════════════ -->
  <svg style="position:absolute;inset:0;z-index:5;overflow:visible;"
       width="1080" height="1080" viewBox="0 0 1080 1080"
       fill="none" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <!-- Inward arrowhead -->
      <marker id="arr" markerWidth="10" markerHeight="10"
              refX="7" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M 0 1.5 L 0 8.5 L 8 5 Z"
              fill="#28C76F" opacity="0.7"/>
      </marker>

      <!-- Tub drop-shadow -->
      <filter id="shadow" x="-25%" y="-15%" width="150%" height="150%">
        <feDropShadow dx="0" dy="18" stdDeviation="28"
                      flood-color="#1C1C1C" flood-opacity="0.10"/>
      </filter>

      <!-- Subtle inner glow on label -->
      <filter id="label-glow" x="-5%" y="-5%" width="110%" height="110%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- ─── CURVED DASHED ARROWS (pointing inward) ──────
         Each Bézier starts at the metric edge and curves
         toward the tub corner quadrant.
    ─────────────────────────────────────────────────── -->

    <!-- TL metric → product top-left quadrant -->
    <path d="M 255 332 C 310 348 368 386 418 420"
          stroke="#28C76F" stroke-width="2.2" stroke-dasharray="8 6"
          stroke-linecap="round" opacity="0.50" marker-end="url(#arr)"/>

    <!-- TR metric → product top-right quadrant -->
    <path d="M 825 332 C 770 348 712 386 662 420"
          stroke="#28C76F" stroke-width="2.2" stroke-dasharray="8 6"
          stroke-linecap="round" opacity="0.50" marker-end="url(#arr)"/>

    <!-- BL metric → product bottom-left quadrant -->
    <path d="M 255 748 C 310 732 368 694 418 660"
          stroke="#28C76F" stroke-width="2.2" stroke-dasharray="8 6"
          stroke-linecap="round" opacity="0.50" marker-end="url(#arr)"/>

    <!-- BR metric → product bottom-right quadrant -->
    <path d="M 825 748 C 770 732 712 694 662 660"
          stroke="#28C76F" stroke-width="2.2" stroke-dasharray="8 6"
          stroke-linecap="round" opacity="0.50" marker-end="url(#arr)"/>

    <!-- ─── SUPPLEMENT TUB ─────────────────────────────
         Body rect  x 388–692  (w 304),  y 384–712  (h 328).
         Centred at (540, 548).
    ─────────────────────────────────────────────────── -->

    <!-- Ground shadow -->
    <ellipse cx="540" cy="706" rx="126" ry="16" fill="rgba(0,0,0,0.07)"/>

    <g filter="url(#shadow)">
      <!-- Base -->
      <ellipse cx="540" cy="700" rx="152" ry="30" fill="#D2CEC5"/>
      <!-- Cylinder -->
      <rect x="388" y="384" width="304" height="318" rx="20" fill="white"/>
      <!-- Lid layers -->
      <ellipse cx="540" cy="382" rx="152" ry="30" fill="#C6C3BB"/>
      <ellipse cx="540" cy="374" rx="136" ry="22" fill="#D3D0C8"/>
      <ellipse cx="540" cy="367" rx="118" ry="16" fill="#DEDAD3"/>
      <!-- Lid specular highlight -->
      <ellipse cx="532" cy="363" rx="64"  ry="8"
               fill="rgba(255,255,255,0.55)"/>
    </g>

    <!-- ── LABEL (sits on white cylinder) ── -->
    <rect x="398" y="400" width="284" height="294" rx="8" fill="#FAFAFB"/>

    <!-- BRAND NAME -->
    <text x="540" y="454"
          text-anchor="middle"
          font-family="'Gill Sans MT','Gill Sans','Century Gothic','Trebuchet MS',Arial,sans-serif"
          font-size="26" font-weight="900"
          fill="#1C1C1C" letter-spacing="7">BE AMAZING</text>

    <!-- Rule -->
    <line x1="448" y1="465" x2="632" y2="465"
          stroke="#E4E1DA" stroke-width="1"/>

    <!-- Product type -->
    <text x="540" y="488"
          text-anchor="middle"
          font-family="'Gill Sans MT','Gill Sans','Century Gothic','Trebuchet MS',Arial,sans-serif"
          font-size="13" font-weight="600"
          fill="#AAAAAA" letter-spacing="5">VEGAN PROTEIN</text>

    <!-- ── Green band ── -->
    <rect x="398" y="502" width="284" height="78" fill="#28C76F"/>

    <!-- Protein callout on band -->
    <text x="540" y="530"
          text-anchor="middle"
          font-family="'Gill Sans MT','Gill Sans','Century Gothic','Trebuchet MS',Arial,sans-serif"
          font-size="22" font-weight="900"
          fill="white" letter-spacing="3">20G PROTEIN</text>
    <text x="540" y="551"
          text-anchor="middle"
          font-family="'Gill Sans MT','Gill Sans','Century Gothic','Trebuchet MS',Arial,sans-serif"
          font-size="11" font-weight="600"
          fill="rgba(255,255,255,0.78)" letter-spacing="3">PER SERVING</text>

    <!-- Flavour -->
    <text x="540" y="598"
          text-anchor="middle"
          font-family="'Gill Sans MT','Gill Sans','Century Gothic','Trebuchet MS',Arial,sans-serif"
          font-size="13" font-weight="600"
          fill="#C0C0C0" letter-spacing="4">VANILLA SOFT SERVE</text>

    <!-- Servings / weight -->
    <text x="540" y="620"
          text-anchor="middle"
          font-family="'Gill Sans MT','Gill Sans','Century Gothic','Trebuchet MS',Arial,sans-serif"
          font-size="11" font-weight="500"
          fill="#D0D0D0" letter-spacing="2">25 SERVINGS  ·  1.7 LB</text>

    <!-- Certification -->
    <text x="540" y="645"
          text-anchor="middle"
          font-family="'Gill Sans MT','Gill Sans','Century Gothic','Trebuchet MS',Arial,sans-serif"
          font-size="10" font-weight="700"
          fill="#28C76F" letter-spacing="2">★  THIRD PARTY TESTED  ★</text>

    <!-- ── Subtle corner accents (editorial feel) ── -->
    <line x1="44" y1="44" x2="78" y2="44"   stroke="#D0CCC4" stroke-width="1.5"/>
    <line x1="44" y1="44" x2="44" y2="78"   stroke="#D0CCC4" stroke-width="1.5"/>
    <line x1="1036" y1="44" x2="1002" y2="44" stroke="#D0CCC4" stroke-width="1.5"/>
    <line x1="1036" y1="44" x2="1036" y2="78" stroke="#D0CCC4" stroke-width="1.5"/>
    <line x1="44" y1="1036" x2="78" y2="1036"   stroke="#D0CCC4" stroke-width="1.5"/>
    <line x1="44" y1="1036" x2="44" y2="1002"   stroke="#D0CCC4" stroke-width="1.5"/>
    <line x1="1036" y1="1036" x2="1002" y2="1036" stroke="#D0CCC4" stroke-width="1.5"/>
    <line x1="1036" y1="1036" x2="1036" y2="1002" stroke="#D0CCC4" stroke-width="1.5"/>

  </svg>
  <!-- ── end SVG ── -->

  <!-- ── Metric callouts ── -->
  <div class="metric m-tl">
    <div class="mn">35+</div>
    <div class="ml">Superfoods<br>Per Serving</div>
  </div>

  <div class="metric m-tr">
    <div class="mn">4.8★</div>
    <div class="ml">Average<br>Rating</div>
  </div>

  <div class="metric m-bl">
    <div class="mn">20g</div>
    <div class="ml">Clean Protein<br>Per Scoop</div>
  </div>

  <div class="metric m-br">
    <div class="mn">0g</div>
    <div class="ml">Added<br>Sugar</div>
  </div>

  <!-- ── Footer ── -->
  <div class="tagline">Be Happy · Be Healthy</div>

  <div class="logo">
    <div class="logo-mark">BA</div>
    <div class="logo-name">Be Amazing</div>
  </div>

</div>
</body>
</html>
